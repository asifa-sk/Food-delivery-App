
spring.application.name=Foodyy
server.port=${PORT:8081}

spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Use explicit migrations for schema changes. Keep Hibernate DDL disabled for production-like runs.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Let Hibernate pick the best MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=foodyy205@gmail.com
spring.mail.password=opusywjemlkafpuz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

firebase.service-account-path=C:/Users/MY PC/OneDrive/Desktop/Food-App/firebase-service-account.json

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Enable Flyway debug logging to help diagnose migration problems
logging.level.org.flywaydb=DEBUG
logging.level.org.flywaydb.core=DEBUG

# ── QA / Dev mode ────────────────────────────────────────────────────────────

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
# Set to true ONLY in local dev/QA environments.
# Exposes the generated OTP in the API response so Postman can auto-capture it.
# MUST be false (or absent) in staging and production.
app.expose-otp-in-response=true

# Redis-backed delivery tracking
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
app.tracking.redis.channel=${TRACKING_REDIS_CHANNEL:tracking:orders:updates}
app.tracking.redis.key-prefix=${TRACKING_REDIS_KEY_PREFIX:tracking:order:}
app.tracking.redis.ttl-minutes=${TRACKING_REDIS_TTL_MINUTES:180}
app.tracking.redis.listener-enabled=${TRACKING_REDIS_LISTENER_ENABLED:false}
